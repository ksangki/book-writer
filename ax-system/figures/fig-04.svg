<rect width="1000" height="430" fill="#f7f3ea"/><text x="410" y="52" fill="#26231e" font-size="18" text-anchor="middle" font-weight="700">순순히 채워지는 일곱 칸</text><rect x="60" y="80" width="180" height="110" rx="10" fill="#16222e"/><text x="150.0" y="142.0" fill="#f3efe4" font-size="20" font-weight="700" text-anchor="middle"></text><text x="150" y="132" fill="#f3efe4" font-size="17" font-weight="700" text-anchor="middle">1</text><text x="150" y="158" fill="#f3efe4" font-size="16" text-anchor="middle">디지털 신원</text><text x="216" y="110" fill="#7fbf9d" font-size="20" text-anchor="middle">✓</text><rect x="255" y="80" width="180" height="110" rx="10" fill="#16222e"/><text x="345.0" y="142.0" fill="#f3efe4" font-size="20" font-weight="700" text-anchor="middle"></text><text x="345" y="132" fill="#f3efe4" font-size="17" font-weight="700" text-anchor="middle">2</text><text x="345" y="158" fill="#f3efe4" font-size="16" text-anchor="middle">권한 범위</text><text x="411" y="110" fill="#7fbf9d" font-size="20" text-anchor="middle">✓</text><rect x="450" y="80" width="180" height="110" rx="10" fill="#16222e"/><text x="540.0" y="142.0" fill="#f3efe4" font-size="20" font-weight="700" text-anchor="middle"></text><text x="540" y="132" fill="#f3efe4" font-size="17" font-weight="700" text-anchor="middle">3</text><text x="540" y="158" fill="#f3efe4" font-size="16" text-anchor="middle">데이터 민감도</text><text x="606" y="110" fill="#7fbf9d" font-size="20" text-anchor="middle">✓</text><rect x="645" y="80" width="180" height="110" rx="10" fill="#16222e"/><text x="735.0" y="142.0" fill="#f3efe4" font-size="20" font-weight="700" text-anchor="middle"></text><text x="735" y="132" fill="#f3efe4" font-size="17" font-weight="700" text-anchor="middle">4</text><text x="735" y="158" fill="#f3efe4" font-size="16" text-anchor="middle">행위 범위</text><text x="801" y="110" fill="#7fbf9d" font-size="20" text-anchor="middle">✓</text><rect x="60" y="220" width="180" height="110" rx="10" fill="#16222e"/><text x="150.0" y="282.0" fill="#f3efe4" font-size="20" font-weight="700" text-anchor="middle"></text><text x="150" y="272" fill="#f3efe4" font-size="17" font-weight="700" text-anchor="middle">5</text><text x="150" y="298" fill="#f3efe4" font-size="16" text-anchor="middle">사람의 개입 지점</text><text x="216" y="250" fill="#7fbf9d" font-size="20" text-anchor="middle">✓</text><rect x="255" y="220" width="180" height="110" rx="10" fill="#16222e"/><text x="345.0" y="282.0" fill="#f3efe4" font-size="20" font-weight="700" text-anchor="middle"></text><text x="345" y="272" fill="#f3efe4" font-size="17" font-weight="700" text-anchor="middle">6</text><text x="345" y="298" fill="#f3efe4" font-size="16" text-anchor="middle">감사와 추적성</text><text x="411" y="250" fill="#7fbf9d" font-size="20" text-anchor="middle">✓</text><rect x="450" y="220" width="180" height="110" rx="10" fill="#16222e"/><text x="540.0" y="282.0" fill="#f3efe4" font-size="20" font-weight="700" text-anchor="middle"></text><text x="540" y="272" fill="#f3efe4" font-size="17" font-weight="700" text-anchor="middle">7</text><text x="540" y="298" fill="#f3efe4" font-size="16" text-anchor="middle">업무 연속성</text><text x="606" y="250" fill="#7fbf9d" font-size="20" text-anchor="middle">✓</text><text x="730" y="192" fill="#b4573f" font-size="18" text-anchor="middle" font-weight="700">늘 비어 있는 칸</text><rect x="645" y="220" width="180" height="110" rx="10" fill="#fffdf8" stroke="#b4573f" stroke-width="2" stroke-dasharray="8 6"/><text x="735.0" y="281.3" fill="#26231e" font-size="18" font-weight="700" text-anchor="middle"></text><text x="735" y="272" fill="#b4573f" font-size="17" font-weight="700" text-anchor="middle">8 재심사와</text><text x="735" y="296" fill="#b4573f" font-size="17" font-weight="700" text-anchor="middle">폐기 기준</text><text x="500" y="400" fill="#6f6a5e" font-size="16" text-anchor="middle">들이는 일곱 칸은 채워지고, 내보내는 한 칸은 비어 있다</text></svg>
