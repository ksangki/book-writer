<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:local('Pretendard')}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222;font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;word-break:keep-all}
.s{width:1080px;height:1350px;background:linear-gradient(180deg,#0a111d 0%,#0e1826 60%,#102330 100%);color:#f3ede2;position:relative;overflow:hidden;padding:96px 88px}
.k{font-size:30px;letter-spacing:.08em;color:#f1c86c;font-weight:700}
.n{position:absolute;right:88px;top:96px;font-size:28px;color:#7f8ea0;font-weight:600}
h1{font-size:76px;line-height:1.25;font-weight:800;margin-top:36px}
h2{font-size:62px;line-height:1.3;font-weight:800;margin-top:30px}
p{font-size:38px;line-height:1.6;color:#c9d3dd;margin-top:34px}
.g{color:#f1c86c}
.bar{width:90px;height:6px;background:#f1c86c;margin-top:40px}
.foot{position:absolute;left:88px;right:88px;bottom:72px;font-size:26px;color:#7f8ea0;display:flex;justify-content:space-between}
.img{position:absolute;left:0;right:0;top:0;height:640px;background-size:cover;background-position:center}
.img:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,17,29,0) 55%,#0b1320 100%)}
.below{position:absolute;left:88px;right:88px;top:640px}
.below h2{font-size:74px}
.below p{font-size:44px;line-height:1.6;margin-top:44px}
.img+.n{color:#f3ede2;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.q{font-size:44px;line-height:1.55;color:#c9d3dd;margin-top:28px}
.q b{color:#f3ede2}
.big{font-size:58px;line-height:1.45;font-weight:800;color:#f1c86c;margin-top:28px}
ul{list-style:none;margin-top:30px}
li{font-size:34px;line-height:1.5;color:#dbe2e9;padding:18px 0 18px 40px;border-top:1px solid #263547;position:relative}
li:before{content:'';position:absolute;left:4px;top:36px;width:14px;height:14px;border-radius:50%;background:#f1c86c}
.tag{display:inline-block;font-size:26px;font-weight:700;color:#0b1320;background:#f1c86c;border-radius:30px;padding:6px 20px;margin-top:40px}
.cover{display:flex;align-items:center;justify-content:center;padding:0;background:#0a111d}
.cover img{height:1350px}
.url{font-size:40px;color:#f1c86c;font-weight:700;margin-top:20px;word-break:break-all}
</style></head><body>
<!-- 캐러셀 템플릿 (1080×1350, 6~10장). 내용은 수락된 원고에서만 가져온다. -->
<!-- 순서: 표지 → 질문 → 핵심 3장(삽화 위 한 문장) → 도구 하나 → 읽는 곳 -->

<div class="s cover"><img src="cover.png"></div>

<div class="s"><div class="k">{작은 머리말}</div><div class="n">2 / N</div>
<h1>{책이 던지는 질문 한 줄}</h1><div class="bar"></div>
<p>{질문을 받치는 두세 문장. 원고 문장 그대로}</p>
<div class="foot"><span>「{책 제목}」 {장}</span><span>{저자}</span></div></div>

<div class="s" style="padding:0"><div class="img" style="background-image:url(ill1.jpg)"></div><div class="n">3 / N</div>
<div class="below"><div class="k">{핵심 · 1}</div>
<h2>{한 문장} <span class="g">{강조}</span></h2>
<p>{근거 한두 문장, 수치는 출처 라벨과 함께}</p></div>
<div class="foot"><span>{장 이름}</span></div></div>

<!-- 핵심 2·3도 같은 모양으로 -->

<div class="s"><div class="k">다음 주에 해 볼 것</div><div class="n">N-1 / N</div>
<h2>{도구 이름}</h2><div class="bar"></div>
<p>{도구를 쓰는 법 두세 줄}</p></div>

<div class="s"><div class="k">읽는 곳</div><div class="n">N / N</div>
<h2>웹에서 무료로 읽기</h2><div class="bar"></div>
<p>ksangki.github.io/{repo}</p>
<p>EPUB · 발표자료 · 영상</p></div>
</body></html>
